<h3>Meteringpoint: {{ mp.name }}</h2>
<p>Interval: {{ interval }}</p>
<p>Number of Points: {{ form.count }}</p>
<table class="table table-hover table-condensed">
    <thead>
    <tr>
        <th>Date</th>
        <th>Value</th>
        <th>Unit</th>
    </tr>
    </thead>
    <tbody>
{% for item in form.all %}
    <tr>
        <td>{{ item.reading_date }}</th>
        <td>{{ item.energy_delta }}</td>
        <td>{{ unit }}</td>
    </tr>
{% endfor %}
    </tbody>
</table>
{{ post }}
